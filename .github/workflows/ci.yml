name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  FORCE_RUSTYCSV_BUILD: true
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  test:

    name: Build and test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - pair:
              elixir: 1.18
              otp: 27
          - pair:
              elixir: 1.19
              otp: 28
          - pair:
              elixir: "1.20"
              otp: 29

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{matrix.pair.elixir}}
        otp-version: ${{matrix.pair.otp}}
    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        toolchain: nightly-2026-07-27
        components: rustfmt, clippy
    - name: Restore Elixir dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{matrix.pair.elixir}}-${{matrix.pair.otp}}-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-${{matrix.pair.elixir}}-${{matrix.pair.otp}}-
    - name: Restore Cargo cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Install dependencies
      run: mix deps.get
    - name: Check formatting
      run: mix format --check-formatted && cargo fmt --all --check --manifest-path native/rustycsv/Cargo.toml
    - name: Clippy
      run: |
        cargo clippy --manifest-path native/rustycsv/Cargo.toml --workspace --all-targets --locked -- -D warnings
        cargo clippy --manifest-path native/rustycsv/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
    - name: Rust tests
      run: |
        cargo test --manifest-path native/rustycsv/Cargo.toml --workspace --locked
        cargo test --manifest-path native/rustycsv/Cargo.toml --workspace --all-features --locked
    - name: Miri pure Rust parser tests
      if: matrix.pair.elixir == '1.20'
      run: |
        rustup component add --toolchain nightly-2026-07-27 miri rust-src
        cargo +nightly-2026-07-27 miri test --manifest-path native/rustycsv/Cargo.toml --no-default-features core::
        cargo +nightly-2026-07-27 miri test --manifest-path native/rustycsv/Cargo.toml --no-default-features strategy::encode::tests
    - name: Run tests
      run: mix test
    - name: Verify packaged source build
      if: matrix.pair.elixir == '1.20'
      run: |
        package_dir="$(mktemp -d)"
        mix hex.build --unpack --output "$package_dir"
        cargo build --release --locked --manifest-path "$package_dir/native/rustycsv/Cargo.toml"
