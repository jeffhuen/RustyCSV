[package]
name = "rustycsv"
version = "0.4.1"
authors = ["Jeff Huen"]
edition = "2021"

[lib]
name = "rustycsv"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[dependencies]
rustler = "0.38.0"
rayon = "1.12"      # Data parallelism for parallel parsing
thiserror = "2.0"   # Idiomatic error types for library code
mimalloc = { version = "0.1.52", default-features = false, optional = true }

[dev-dependencies]
# Statistical benchmark harness. Rule 8 requires a recorded baseline before any
# change justified by speed; criterion's --save-baseline/--baseline gives that.
# Lean feature set: no plotting, no rayon in the harness itself.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "scanner"
harness = false

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, optional = true, features = ["local_dynamic_tls"] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.release]
panic = "unwind"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
# Enable memory tracking (adds overhead - use only for profiling)
memory_tracking = []
# NIF version features for rustler_precompiled (OTP 24+ = 2.15, OTP 26 = 2.16, OTP 27+ = 2.17)
nif_version_2_15 = ["rustler/nif_version_2_15"]
nif_version_2_16 = ["rustler/nif_version_2_16"]
nif_version_2_17 = ["rustler/nif_version_2_17"]
