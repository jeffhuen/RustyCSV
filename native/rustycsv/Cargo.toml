[package]
name = "rustycsv"
version = "0.3.9"
authors = ["Jeff Huen"]
edition = "2021"

[lib]
name = "rustycsv"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[dependencies]
rustler = { git = "https://github.com/rusterlium/rustler.git", branch = "master" }
rayon = "1.10"    # Data parallelism for parallel parsing
thiserror = "2"   # Idiomatic error types for library code
mimalloc = { version = "0.1", default-features = false, optional = true }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true, features = ["local_dynamic_tls"] }

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
# Enable memory tracking (adds overhead - use only for profiling)
memory_tracking = []
# NIF version features for rustler_precompiled (OTP 24+ = 2.15, OTP 26 = 2.16, OTP 27+ = 2.17)
nif_version_2_15 = ["rustler/nif_version_2_15"]
nif_version_2_16 = ["rustler/nif_version_2_16"]
nif_version_2_17 = ["rustler/nif_version_2_17"]
